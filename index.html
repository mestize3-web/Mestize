<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSTZ by MESTIZE</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #1a1a1a; border-bottom: 2px solid #e60000; }
    .logo-container { display: flex; align-items: center; gap: 10px; }
    .logo-text { font-size: 24px; font-weight: bold; color: #fff; }
    .logo-text span { color: #e60000; }
    
    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #222; border: 1px solid #333; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
    .card:hover { border-color: #e60000; }
    .card h3 { margin: 10px 0 5px; color: #fff; text-transform: uppercase; }

    /* Estilos Modo Editar */
    .editing [contenteditable="true"] { border: 1px dashed #ffff00 !important; outline: none; }
    
    /* Panel de Subcarpetas e Imágenes */
    #catalog-view { margin-top: 30px; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #444; }
    .folder-block { background: #2a2a2a; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    .gallery { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .gallery img { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; border: 1px solid #555; }
    
    .btn { background: #e60000; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-success { background: #009900; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container" id="logo-box">
      <div class="logo-text" id="site-logo-text">MSTZ <span>by MESTIZE</span></div>
    </div>
  </header>

  <main>
    <h2 style="text-align: center; margin-top: 20px;">CATÁLOGO</h2>
    
    <div class="grid-container">
      <div class="card" onclick="selectCategory('novedades')"><h3>Novedades</h3></div>
      <div class="card" onclick="selectCategory('playeras')"><h3>Playeras</h3></div>
      <div class="card" onclick="selectCategory('sudaderas')"><h3>Sudaderas</h3></div>
      <div class="card" onclick="selectCategory('tazas')"><h3>Tazas</h3></div>
      <div class="card" onclick="selectCategory('termos')"><h3>Termos</h3></div>
      <div class="card" onclick="selectCategory('tarros')"><h3>Tarros</h3></div>
      <div class="card" onclick="selectCategory('lanyards')"><h3>Lanyards</h3></div>
      <div class="card" onclick="selectCategory('cojines')"><h3>Cojines</h3></div>
    </div>

    <!-- Vista de Contenido de la Categoría Seleccionada -->
    <section id="catalog-view">
      <div style="display:flex; justify-shadow:space-between; align-items:center; justify-content: space-between;">
        <h3 id="category-title" style="color: #e60000; margin: 0;">SELECCIONA UNA CATEGORÍA</h3>
        <button id="add-folder-btn" class="btn" style="display:none;" onclick="createSubfolder()">+ Crear Subcarpeta</button>
      </div>
      <hr style="border-color: #333; margin: 15px 0;">
      <div id="folders-container">
        <p style="color: #888;">Haz clic en una categoría para ver o agregar subcarpetas e imágenes.</p>
      </div>
    </section>
  </main>

  <script>
    let catalogData = JSON.parse(localStorage.getItem('mstize_catalog')) || {
      novedades: [], playeras: [], sudaderas: [], tazas: [], termos: [], tarros: [], lanyards: [], cojines: []
    };
    let currentCategory = '';
    let isEditingMode = false;

    document.addEventListener('DOMContentLoaded', function() {
      // Cargar Logo
      const savedLogo = localStorage.getItem('mstize_logo');
      if (savedLogo) displayLogo(savedLogo);

      // Detectar Modo Admin
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('admin') === 'true' || window.location.href.includes('admin=true')) {
        renderAdminControls();
      }
    });

    function renderAdminControls() {
      const adminBtn = document.createElement('button');
      adminBtn.innerText = 'Modo Editar';
      adminBtn.className = 'btn';
      adminBtn.style.cssText = 'position:fixed; top:15px; right:15px; z-index:99999;';
      
      adminBtn.onclick = function() {
        isEditingMode = !isEditingMode;
        document.body.classList.toggle('editing', isEditingMode);
        this.innerText = isEditingMode ? 'Guardar Cambios' : 'Modo Editar';
        this.className = isEditingMode ? 'btn btn-success' : 'btn';

        // Hacer textos editables
        document.querySelectorAll('h2, h3, p, span').forEach(el => {
          el.contentEditable = isEditingMode ? "true" : "false";
        });

        // Mostrar botón de subcarpeta si hay categoría seleccionada
        if (currentCategory) {
          document.getElementById('add-folder-btn').style.display = isEditingMode ? 'block' : 'none';
        }

        // Control para cambiar logo
        let logoInput = document.getElementById('logo-file-input');
        if (isEditingMode && !logoInput) {
          logoInput = document.createElement('input');
          logoInput.type = 'file';
          logoInput.id = 'logo-file-input';
          logoInput.accept = 'image/*';
          logoInput.style.cssText = 'position:fixed; top:60px; right:15px; z-index:99999; background:#fff; color:#000; padding:5px; border-radius:4px;';
          logoInput.onchange = uploadLogo;
          document.body.appendChild(logoInput);
        } else if (!isEditingMode && logoInput) {
          logoInput.remove();
        }
      };
      document.body.appendChild(adminBtn);
    }

    function selectCategory(cat) {
      currentCategory = cat;
      document.getElementById('category-title').innerText = cat.toUpperCase();
      document.getElementById('add-folder-btn').style.display = isEditingMode ? 'block' : 'none';
      renderFolders();
    }

    function createSubfolder() {
      const folderName = prompt('Nombre de la nueva subcarpeta (ej. 15 de Septiembre):');
      if (folderName) {
        if (!catalogData[currentCategory]) catalogData[currentCategory] = [];
        catalogData[currentCategory].push({ name: folderName, images: [] });
        saveAndRender();
      }
    }

    function renderFolders() {
      const container = document.getElementById('folders-container');
      container.innerHTML = '';
      const folders = catalogData[currentCategory] || [];

      if (folders.length === 0) {
        container.innerHTML = '<p style="color:#888;">No hay subcarpetas creadas en esta sección.</p>';
        return;
      }

      folders.forEach((folder, folderIdx) => {
        const block = document.createElement('div');
        block.className = 'folder-block';
        
        let uploadHTML = isEditingMode ? `
          <input type="file" multiple accept="image/*" style="margin-top:10px;" onchange="uploadImages(event, ${folderIdx})">
        ` : '';

        let imagesHTML = folder.images.map(imgSrc => <img src="${imgSrc}">).join('');

        block.innerHTML = `
          <h4 style="margin:0; color:#fff;">📁 ${folder.name}</h4>
          ${uploadHTML}
          <div class="gallery">${imagesHTML}</div>
        `;
        container.appendChild(block);
      });
    }

    function uploadImages(event, folderIdx) {
      const files = event.target.files;
      if (!files.length) return;

      let loaded = 0;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          catalogData[currentCategory][folderIdx].images.push(e.target.result);
          loaded++;
          if (loaded === files.length) saveAndRender();
        };
        reader.readAsDataURL(file);
      });
    }

    function uploadLogo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgData = e.target.result;
          displayLogo(imgData);
          localStorage.setItem('mstize_logo', imgData);
        };
        reader.readAsDataURL(file);
      }
    }

    function displayLogo(imgData) {
      const box = document.getElementById('logo-box');
      box.innerHTML = <img src="${imgData}" style="max-height: 50px;">;
    }

    function saveAndRender() {
      localStorage.setItem('mstize_catalog', JSON.stringify(catalogData));
      renderFolders();
    }
  </script>
</body>
</html>
